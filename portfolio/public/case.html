<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品案例 — 张君睿 · 视频剪辑师</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%239EFF00'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- 导航栏（作品激活） -->
  <nav class="nav">
    <a class="nav-brand" href="/">
      <span class="nav-brand-glyph"></span>
      <span class="nav-brand-text">
        <span class="nav-brand-name">张君睿</span>
        <span class="nav-brand-role">VIDEO EDITOR</span>
      </span>
    </a>
    <div class="nav-links">
      <a class="nav-link" href="/#top">首页</a>
      <a class="nav-link" href="/#about">关于</a>
      <a class="nav-link active" href="/#works">作品</a>
      <a class="nav-link" href="/#skills">技能</a>
      <a class="nav-link" href="/#contact">联系</a>
    </div>
    <div class="nav-right">
      <a class="btn btn-nav" href="/#contact">联系我</a>
      <button class="nav-menu-btn" id="menuBtn" aria-label="菜单">
        <svg viewBox="0 0 20 14" fill="none"><path d="M1 1H19M1 7H19M1 13H19" stroke="#FFFFFF" stroke-width="1.8"/></svg>
      </button>
    </div>
  </nav>
  <div class="mobile-menu" id="mobileMenu">
    <a href="/#top">首页</a>
    <a href="/#about">关于</a>
    <a href="/#works" class="active">作品</a>
    <a href="/#skills">技能</a>
    <a href="/#contact">联系</a>
  </div>

  <main id="caseRoot">
    <div class="back-bar"><a href="/#works">
      <svg viewBox="0 0 16 16" fill="none"><path d="M9.5 3L4.5 8L9.5 13" stroke="#A3A3A3" stroke-width="1.8"/></svg>
      返回精选作品
    </a></div>

    <header class="case-header">
      <div class="case-meta-row" id="caseMetaRow"></div>
      <h1 class="case-title" id="caseTitle"></h1>
    </header>

    <section class="player-section">
      <div class="player" id="player">
        <img class="player-poster" id="playerPoster" src="" alt="视频封面" />
        <button class="play-btn" id="bigPlayBtn" aria-label="播放">
          <svg viewBox="0 0 30 24" fill="none"><path d="M3 2L27 12L3 22V2Z" fill="#000000"/></svg>
        </button>
        <span class="player-note">点击播放 · 静音循环预览</span>
        <div class="control-bar">
          <button class="ctrl-ic ctrl-toggle" aria-label="播放/暂停">
            <svg viewBox="0 0 18 18" fill="none"><path d="M3 2L15 9L3 16V2Z" fill="#FFFFFF"/></svg>
          </button>
          <span class="ctrl-time">00:00 / 01:32</span>
          <div class="ctrl-track"><div class="ctrl-fill"></div></div>
          <button class="ctrl-ic ctrl-mute" aria-label="静音切换">
            <svg viewBox="0 0 18 18" fill="none"><path d="M2 6V12H4.5L8.5 15.5V2.5L4.5 6H2Z" stroke="#FFFFFF" stroke-width="1.5"/><path d="M11.5 6C12.8 7.2 12.8 10.8 11.5 12" stroke="#FFFFFF" stroke-width="1.5"/><path d="M14 4C16.2 6 16.2 12 14 14" stroke="#FFFFFF" stroke-width="1.5"/></svg>
          </button>
          <button class="ctrl-ic ctrl-full" aria-label="全屏">
            <svg viewBox="0 0 18 18" fill="none"><path d="M1.5 6V1.5H6M12 1.5H16.5V6M16.5 12V16.5H12M6 16.5H1.5V12" stroke="#FFFFFF" stroke-width="1.5"/></svg>
          </button>
        </div>
      </div>
    </section>

    <section class="case-content">
      <div class="case-two-col">
        <div class="case-col-left" id="caseLeftCol"></div>
        <div class="case-col-right" id="caseRightCol"></div>
      </div>
    </section>

    <section class="more-section">
      <div class="more-title-row">
        <span class="more-title">更多作品</span>
        <a class="more-link" href="/#works">查看全部 →</a>
      </div>
      <div class="more-row" id="moreRow"></div>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="footer-row">
      <span class="footer-brand">张君睿 · VIDEO EDITOR</span>
      <div class="footer-links">
        <a href="/#top">首页</a><a href="/#about">关于</a><a href="/#works">作品</a><a href="/#skills">技能</a><a href="/#contact">联系</a>
      </div>
      <span class="footer-copy">© 2026 张君睿 · 求职作品集</span>
    </div>
  </footer>

  <!-- 视频播放弹窗 -->
  <div class="video-modal" id="videoModal">
    <div class="video-modal-inner">
      <button class="video-modal-close" id="videoModalClose" aria-label="关闭">✕</button>
      <div id="videoModalBody"></div>
      <div class="video-modal-tip" id="videoModalTip"></div>
    </div>
  </div>

  <!--CONTENT_INJECT-->
  <script src="/js/main.js"></script>
</body>
</html>
